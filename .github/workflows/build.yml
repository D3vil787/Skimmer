name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # A release is made automatically when Version in Skimmer.csproj has no tag yet.
      - name: Detect version
        id: ver
        shell: bash
        run: |
          VER=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Skimmer.csproj | head -1 | tr -d '\r')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && [ -z "$(git ls-remote --tags origin "refs/tags/v$VER")" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $VER"

      - name: Publish portable exe (self-contained, nothing to install)
        shell: bash
        run: |
          mkdir -p logs
          dotnet publish Skimmer.csproj -c Release -p:PublishSingleFile=true -o out/portable 2>&1 | tee logs/portable.log

      - name: Publish small exe (needs .NET 8 Desktop Runtime)
        shell: bash
        run: |
          mkdir -p logs
          dotnet publish Skimmer.csproj -c Release -p:PublishSingleFile=true -p:SelfContained=false -p:RuntimeIdentifier=win-x64 -p:SkimmerVariant=small -o out/small 2>&1 | tee logs/small.log

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/portable/Skimmer.exe dist/Skimmer.exe
          Copy-Item out/small/Skimmer.exe dist/Skimmer-small.exe
          Get-ChildItem dist | Format-Table Name, Length
          $lines = Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Skimmer
          path: dist/*

      - name: Publish release
        if: steps.ver.outputs.release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

      # Writes the build log to the orphan branch "ci-log" so it can be read without opening Actions.
      - name: Publish build log to ci-log branch
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p ci
          cp -r logs/. ci/ 2>/dev/null || true
          grep -hE "error |warning CS" logs/*.log > ci/errors.txt 2>/dev/null || true
          {
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "job status: ${{ job.status }}"
            date -u
          } > ci/summary.txt
          cd ci
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "build log for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log
